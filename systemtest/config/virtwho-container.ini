; virtwho-container.ini -- [rhsm] values for the containerized
; Candlepin destination tier (VIRTWHO_DESTINATION=container, the
; default since CCT-3155).
;
; SYNTHETIC TEST DATA, deliberately publishable: every value below is
; pre-baked into the PUBLIC ghcr.io/candlepin test images
; (candlepin-container-unofficial, digest-pinned in
; systemtest/config/candlepin-pod.yaml) -- the accounts and orgs of
; the Candlepin test suite, not real credentials. They are NOT Vault
; sentinels and NOT VIRTWHO_RHSM_* secrets: there is nothing for
; cleanup-secrets.sh to destroy, which is the point of the tier
; (the stage-credential problem class does not exist here).
;
; generate-virtwho-ini.sh applies this overlay to [rhsm] in container
; mode INSTEAD of the base/env values: the base's [rhsm] sentinels
; are neither resolved nor kept, and VIRTWHO_RHSM_* env secrets do
; NOT override the section (a stale stage secret delivered by an old
; pipeline must not break the hermetic run -- the generator warns
; and ignores them). VIRTWHO_DESTINATION=stage restores today's
; sentinel flow unchanged (scheduled fidelity tier, later).
;
; server=candlepin resolves via the /etc/hosts entry the prepare
; step adds; the pod's TLS certificate carries SANs for that name
; (and localhost/127.0.0.1), so the CA install makes the connection
; verify without insecure flags. default_org is snowwhite, NOT the
; admin org: admin is entitlement-mode-only and would break the SCA
; test (tests/subscription/test_rhsm.py); snowwhite supports both
; modes and testuser1 holds roles there. The baked ACTIVE mode of
; snowwhite (and admin) is 'entitlement' (donaldduck is the one
; SCA-active baked org, but testuser1 has no access to it) -- and
; RHEL-10's subscription-manager refuses username/password
; registration into an entitlement-mode org (it gates on the ACTIVE
; mode, not the mode LIST). prepare-candlepin.sh therefore ACTIVATES
; SCA on snowwhite before the marker: the same PUT /owners/{org}
; rhsm-qe's suite setup makes (setContentAccesModeBeforeSuite), with
; these very register credentials (testuser1 holds the permission --
; verified live), strictly re-verified by a fresh org read.
;
; baseurl keeps subscription-manager's content access LOCAL and
; dead-by-design: it points at localhost:8080, a port the pod no
; longer binds (no repo container since the run-#7 follow-up --
; virt-who tests virt-who's reporting, not content consumption, and
; the package tests' version under test comes from TEST_RPMS or the
; compose, never the destination). This is deliberate on both
; sides: an EMPTY baseurl would make subscription-manager fall back
; to the real CDN (external egress -- the tier must stay hermetic),
; while the unbound local port makes every content operation fail
; locally and bounded (connection refused in ~1 s, verified live;
; registration itself is unaffected -- the round-trip was proven
; with no repo container running).
[rhsm]
server=candlepin
username=testuser1
password=password
prefix=/candlepin
port=8443
baseurl=http://localhost:8080
default_org=snowwhite
activation_key=
proxy_hostname=
proxy_port=
