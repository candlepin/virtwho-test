; virtwho-container.ini -- [rhsm] values for the containerized
; Candlepin destination tier (VIRTWHO_DESTINATION=container, the
; default since CCT-3155).
;
; SYNTHETIC TEST DATA, deliberately publishable: every value below is
; pre-baked into the PUBLIC ghcr.io/candlepin test images
; (digest-pinned in systemtest/config/candlepin-pod.yaml) -- the
; accounts and orgs of the Candlepin test suite, not real
; credentials. They are NOT Vault sentinels and NOT VIRTWHO_RHSM_*
; secrets: there is nothing for cleanup-secrets.sh to destroy.
;
; generate-virtwho-ini.sh applies this overlay to [rhsm] in container
; mode INSTEAD of the base/env values: the base's [rhsm] sentinels
; are neither resolved nor kept, and VIRTWHO_RHSM_* env secrets do
; NOT override the section (a stale stage secret delivered by an old
; pipeline must not break the hermetic run -- the generator warns
; and ignores them). VIRTWHO_DESTINATION=stage selects the sentinel
; flow instead.
;
; server=candlepin resolves via the /etc/hosts entry the prepare
; step adds; the pod's TLS certificate carries SANs for that name
; (and localhost/127.0.0.1), so the CA install makes the connection
; verify without insecure flags. default_org is snowwhite, NOT the
; admin org: admin is entitlement-mode-only and would break the SCA
; test (tests/subscription/test_rhsm.py); snowwhite supports both
; modes and testuser1 holds roles there. The baked ACTIVE mode of
; snowwhite is 'entitlement', and RHEL-10's subscription-manager
; refuses username/password registration into an entitlement-mode org
; (it gates on the ACTIVE mode, not the mode LIST).
; prepare-candlepin.sh therefore ACTIVATES SCA on snowwhite (PUT
; /owners/{org} with these register credentials) and strictly
; re-verifies with a fresh org read before writing its marker.
;
; baseurl keeps subscription-manager's content access LOCAL and
; dead-by-design: it points at localhost:8080, a port the pod does
; not bind. This is deliberate on both sides: an EMPTY baseurl would
; make subscription-manager fall back to the real CDN (external
; egress -- the tier must stay hermetic), while the unbound local
; port makes every content operation fail locally and bounded
; (connection refused). Registration itself is unaffected.
[rhsm]
server=candlepin
username=testuser1
password=password
prefix=/candlepin
port=8443
baseurl=http://localhost:8080
default_org=snowwhite
activation_key=
proxy_hostname=
proxy_port=
