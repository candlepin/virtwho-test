# Testing Farm configuration for virt-who OSCI gating.
# See: https://docs.testing-farm.io/Testing%20Farm/0.1/test-request.html#secrets-in-repo-config
#
# VIRTWHO_INI_URL is a plain (non-secret) Testing Farm variable pointing
# at the sanitized base ini (non-secret values only) that
# generate-virtwho-ini.sh downloads and overlays with the VIRTWHO_* env
# secrets. When it is unset, the generator builds the complete ini from
# the VIRTWHO_* secrets alone. Never point it at a file with credentials.
---
environments:
  default:
    secrets:
      CCT_SSH_KEY_URL: "49aa56cf-d330-42d7-9b53-e95753f0aeb7,"
